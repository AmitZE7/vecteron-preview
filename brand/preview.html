<!doctype html><html><head><meta charset="utf-8"><title>Vecteron logo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Manrope,Arial,sans-serif;background:#e9edf3}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0}
.tile{padding:48px;display:flex;align-items:center;justify-content:center;min-height:260px}
.dark{background:#070B14}.light{background:#fff}.blue{background:#2F7BFF}
.lock{display:flex;align-items:center;gap:16px}
.lock svg{width:64px;height:64px}
.word{font-weight:800;font-size:44px;letter-spacing:-.02em;color:#fff;line-height:1}
.word.on-light{color:#0B1220}
.word small{display:block;font-size:12px;font-weight:700;letter-spacing:.22em;margin-top:6px;opacity:.75}
.caps{font-weight:800;font-size:34px;letter-spacing:.14em;color:#fff}
.caps.on-light{color:#0B1220}
.marks{display:flex;gap:28px;align-items:center}
.marks svg{height:auto}
.fav{width:32px;height:32px;border-radius:7px;background:#2F7BFF;display:grid;place-items:center}
.fav svg{width:22px;height:22px}
</style></head><body>
<div class="row">
  <div class="tile dark"><div class="lock"><svg viewBox="0 0 64 64"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#2F7BFF"/><path d="M44 10h14L38 54h-7z" fill="#38D6FF"/><circle cx="32" cy="46" r="6.5" fill="#070B14" stroke="#fff" stroke-width="3"/></svg><div class="word">Vecteron<small>DATA CENTRES</small></div></div></div>
  <div class="tile light"><div class="lock"><svg viewBox="0 0 64 64"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#2F7BFF"/><path d="M44 10h14L38 54h-7z" fill="#38D6FF"/><circle cx="32" cy="46" r="6.5" fill="#fff" stroke="#0B1220" stroke-width="3"/></svg><div class="word on-light">Vecteron<small>DATA CENTRES</small></div></div></div>
  <div class="tile dark"><div class="lock"><svg viewBox="0 0 64 64" style="width:48px;height:48px"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#2F7BFF"/><path d="M44 10h14L38 54h-7z" fill="#38D6FF"/><circle cx="32" cy="46" r="6.5" fill="#070B14" stroke="#fff" stroke-width="3"/></svg><div class="caps">VECTERON</div></div></div>
  <div class="tile blue"><div class="lock"><svg viewBox="0 0 64 64"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#fff"/><path d="M44 10h14L38 54h-7z" fill="#CFE6FF"/><circle cx="32" cy="46" r="6.5" fill="#2F7BFF" stroke="#fff" stroke-width="3"/></svg><div class="word">Vecteron</div></div></div>
  <div class="tile light"><div class="marks">
    <svg viewBox="0 0 64 64" width="120"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#2F7BFF"/><path d="M44 10h14L38 54h-7z" fill="#38D6FF"/><circle cx="32" cy="46" r="6.5" fill="#fff" stroke="#0B1220" stroke-width="3"/></svg>
    <svg viewBox="0 0 64 64" width="64"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#0B1220"/><path d="M44 10h14L38 54h-7z" fill="#0B1220" opacity=".55"/><circle cx="32" cy="46" r="6.5" fill="#fff" stroke="#0B1220" stroke-width="3"/></svg>
    <div class="fav"><svg viewBox="0 0 64 64"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#fff"/><path d="M44 10h14L38 54h-7z" fill="#CFE6FF"/><circle cx="32" cy="46" r="6.5" fill="#2F7BFF" stroke="#fff" stroke-width="3"/></svg></div>
  </div></div>
  <div class="tile dark"><div class="marks">
    <svg viewBox="0 0 64 64" width="120"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#fff"/><path d="M44 10h14L38 54h-7z" fill="#fff" opacity=".55"/><circle cx="32" cy="46" r="6.5" fill="#070B14" stroke="#fff" stroke-width="3"/></svg>
    <svg viewBox="0 0 64 64" width="40"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#2F7BFF"/><path d="M44 10h14L38 54h-7z" fill="#38D6FF"/><circle cx="32" cy="46" r="6.5" fill="#070B14" stroke="#fff" stroke-width="3"/></svg>
    <svg viewBox="0 0 64 64" width="20"><path d="M6 10h14l12 26 12-26h14L38 54H26z" fill="#2F7BFF"/><path d="M44 10h14L38 54h-7z" fill="#38D6FF"/><circle cx="32" cy="46" r="6.5" fill="#070B14" stroke="#fff" stroke-width="3"/></svg>
  </div></div>
</div>
</body></html>
